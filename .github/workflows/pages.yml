name: Build and deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site unpack
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP archive found in repository root."
            exit 1
          fi
          for archive in "${zips[@]}"; do
            mkdir -p "unpack/${archive%.zip}"
            unzip -q "$archive" -d "unpack/${archive%.zip}"
          done
          # Some app exports wrap the website in artifact.tar.
          while IFS= read -r -d '' tarfile; do
            mkdir -p "$(dirname "$tarfile")/tar-extracted"
            tar -xf "$tarfile" -C "$(dirname "$tarfile")/tar-extracted"
          done < <(find unpack -type f -name '*.tar' -print0)
          # Locate the actual app entry point and publish its complete folder.
          index_file="$(find unpack -type f -name index.html -print -quit)"
          if [ -z "$index_file" ]; then
            echo "index.html was not found inside the uploaded ZIP."
            find unpack -maxdepth 4 -type f | head -100
            exit 1
          fi
          app_dir="$(dirname "$index_file")"
          cp -a "$app_dir"/. site/
          test -s site/index.html
          echo "Published source folder: $app_dir"
          find site -maxdepth 2 -type f | sort | head -100

      - name: Rebuild route data without overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json
          from pathlib import Path

          def read_gzip_b64(name):
              raw = Path(name).read_text().strip()
              try:
                  payload = gzip.decompress(base64.b64decode(raw, validate=True))
              except Exception:
                  payload = None
                  for i in range(len(raw)):
                      candidate = raw[:i] + raw[i+1:]
                      if len(candidate) % 4:
                          continue
                      try:
                          payload = gzip.decompress(base64.b64decode(candidate, validate=True))
                          break
                      except Exception:
                          pass
                  if payload is None:
                      raise RuntimeError(f'{name}: damaged gzip/base64 data')
              return json.loads(payload)

          profile = read_gzip_b64('profile-full-2025.json.gz.b64')
          extension = read_gzip_b64('profile-extension.json.gz.b64')
          objects = read_gzip_b64('route-objects.json.gz.b64')
          path = Path('site/index.html')
          html = path.read_text(encoding='utf-8')
          marker = 'const D = '
          start = html.index(marker) + len(marker)
          end = html.index(';' + chr(10) + '(function', start)
          data = json.loads(html[start:end])

          # Replace the profile arrays completely. The 2025 Zima-Slyudyanka
          # cards replace the former profile over km 4930-5330 (even) and
          # km 5319-4919 (odd); old rows are not appended on top.
          for direction in ('even', 'odd'):
              item = profile[direction]
              pos = int(item['start'])
              rows = []
              for length, grade_tenths in item['rows']:
                  rows.append([pos, int(length), int(grade_tenths) / 10])
                  pos += int(length)
              for previous, current in zip(rows, rows[1:]):
                  if current[0] != previous[0] + previous[1]:
                      raise RuntimeError(f'{direction}: profile has a gap or overlap')
              data[direction]['el'] = rows
              data[direction]['st'] = objects[direction]['st']
              data[direction]['sg'] = sorted(objects[direction]['sg'], key=lambda row: row[0])

          posts = {int(row[0]): row for row in data['posts']}
          for row in extension['posts']:
              posts[int(row[0])] = row
          data['posts'] = [posts[k] for k in sorted(posts)]

          expected = {
              'even': (1627, 4679500, 5649501, 68, 548),
              'odd': (1593, -5649500, -4679500, 68, 551),
          }
          for direction, (count, first, last, stations, signals) in expected.items():
              rows = data[direction]['el']
              if len(rows) != count or rows[0][0] != first or rows[-1][0] + rows[-1][1] != last:
                  raise RuntimeError(f'{direction}: profile range/count validation failed')
              if len(data[direction]['st']) != stations or len(data[direction]['sg']) != signals:
                  raise RuntimeError(f'{direction}: station/signal count validation failed')
          if len(data['posts']) != 970:
              raise RuntimeError('GPS post count validation failed')

          html = html[:start] + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + html[end:]
          html = html.replace('km>=4919&&km<=5330', 'km>=4680&&km<=5649')
          html = html.replace('Оцифрованный профиль уклонов в этой версии есть для 4919–5330 км', 'Оцифрованный профиль уклонов в этой версии есть для 4680–5649 км')
          html = html.replace('profile-app-v3', 'profile-app-v10').replace('profile-app-v4', 'profile-app-v10').replace('profile-app-v5', 'profile-app-v10').replace('profile-app-v9', 'profile-app-v10')
          sw = Path('site/sw.js')
          if sw.exists():
              sw.write_text(sw.read_text().replace('profile-app-v3', 'profile-app-v10').replace('profile-app-v4', 'profile-app-v10').replace('profile-app-v5', 'profile-app-v10').replace('profile-app-v9', 'profile-app-v10'), encoding='utf-8')
          # Draw explicit station entry/exit boundaries and label their km.
          old_station = "  // Станции: очень мягкая подсветка участка и название без разделительных линий"
          new_station = """  // Станции: подсветка участка, чёткие границы начала и конца.
          ds.ST.forEach(st=>{
            if(st.b<a||st.a>b) return;
            const raw1=px(X(st.a)), raw2=px(X(st.b));
            const x1=Math.max(raw1,padL), x2=Math.min(raw2,w-padR);
            const sw=x2-x1;
            if(sw<=2) return;
            ctx.fillStyle='rgba(242,193,78,.055)';
            ctx.fillRect(x1,plotTop-5,sw,plotBot-plotTop+10);
            ctx.save();
            ctx.lineWidth=1.5*k; ctx.setLineDash([4*k,3*k]);
            ctx.strokeStyle='rgba(255,196,74,.95)';
            [raw1,raw2].forEach(x=>{
              if(x>=padL&&x<=w-padR){
                ctx.beginPath(); ctx.moveTo(Math.round(x)+.5,plotTop-5);
                ctx.lineTo(Math.round(x)+.5,plotBot+5); ctx.stroke();
              }
            });
            ctx.setLineDash([]);
            ctx.font=F(9,700); ctx.textBaseline='top';
            const tag=(text,x,align)=>{
              ctx.textAlign=align;
              const label=text;
              const tw=ctx.measureText(label).width;
              const bx=align==='left'?x+3*k:align==='right'?x-tw-7*k:x-tw/2-4*k;
              ctx.fillStyle='rgba(12,17,19,.88)';
              ctx.fillRect(bx,plotTop+3,tw+8*k,14*k);
              ctx.fillStyle='rgba(255,205,105,.98)';
              ctx.fillText(label,bx+4*k,plotTop+5);
            };
            if(raw1>=padL&&raw1<=w-padR) tag('НАЧАЛО '+Math.abs(st.a/1000).toFixed(1),raw1,'left');
            if(raw2>=padL&&raw2<=w-padR) tag('КОНЕЦ '+Math.abs(st.b/1000).toFixed(1),raw2,'right');
            ctx.restore();
            if(sw>48*k){
              const label=st.name;
              ctx.font=F(10,600); ctx.textAlign='center'; ctx.textBaseline='top';
              const maxW=Math.max(0,sw-8*k);
              ctx.save(); ctx.beginPath(); ctx.rect(x1+2,plotTop+20,Math.max(0,sw-4),22*k); ctx.clip();
              const tw=Math.min(ctx.measureText(label).width,maxW);
              ctx.fillStyle='rgba(12,17,19,.55)';
              ctx.fillRect((x1+x2)/2-tw/2-4*k,plotTop+20,tw+8*k,15*k);
              ctx.fillStyle='rgba(230,210,160,.9)';
              ctx.fillText(label,(x1+x2)/2,plotTop+21);
              ctx.restore();
            }
          });
          """
          if old_station not in html:
              raise RuntimeError('Station drawing block was not found in app source')
          html = html.replace(old_station, new_station)
          html = html.replace('profile-app-v10', 'profile-app-v11')
          sw = Path('site/sw.js')
          if sw.exists():
              sw.write_text(sw.read_text().replace('profile-app-v10', 'profile-app-v11'), encoding='utf-8')
          path.write_text(html, encoding='utf-8')

          for direction in ('odd', 'even'):
              rows = data[direction]['el']
              gaps = sum(1 for a, b in zip(rows, rows[1:]) if b[0] > a[0] + a[1] + 0.01)
              overlaps = sum(1 for a, b in zip(rows, rows[1:]) if b[0] < a[0] + a[1] - 0.01)
              print(direction, 'profile rows:', len(rows), 'stations:', len(data[direction]['st']),
                    'signals:', len(data[direction]['sg']), 'gaps:', gaps, 'overlaps:', overlaps)
          print('GPS posts:', len(data['posts']))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
