name: Build and deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site unpack
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP archive found in repository root."
            exit 1
          fi
          for archive in "${zips[@]}"; do
            mkdir -p "unpack/${archive%.zip}"
            unzip -q "$archive" -d "unpack/${archive%.zip}"
          done
          # Some app exports wrap the website in artifact.tar.
          while IFS= read -r -d '' tarfile; do
            mkdir -p "$(dirname "$tarfile")/tar-extracted"
            tar -xf "$tarfile" -C "$(dirname "$tarfile")/tar-extracted"
          done < <(find unpack -type f -name '*.tar' -print0)
          # Locate the actual app entry point and publish its complete folder.
          index_file="$(find unpack -type f -name index.html -print -quit)"
          if [ -z "$index_file" ]; then
            echo "index.html was not found inside the uploaded ZIP."
            find unpack -maxdepth 4 -type f | head -100
            exit 1
          fi
          app_dir="$(dirname "$index_file")"
          cp -a "$app_dir"/. site/
          test -s site/index.html
          echo "Published source folder: $app_dir"
          find site -maxdepth 2 -type f | sort | head -100

      - name: Rebuild route data without overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json
          from pathlib import Path

          def read_gzip_b64(name):
              raw = Path(name).read_text().strip()
              return json.loads(gzip.decompress(base64.b64decode(raw)))

          ext = read_gzip_b64('profile-extension.json.gz.b64')
          objects = read_gzip_b64('station-signal-extension.json.gz.b64')
          path = Path('site/index.html')
          html = path.read_text(encoding='utf-8')
          marker = 'const D = '
          start = html.index(marker) + len(marker)
          end = html.index(';' + chr(10) + '(function', start)
          data = json.loads(html[start:end])

          # Build one non-overlapping profile. New digitized segments take
          # precedence wherever they overlap the old profile; uncovered parts
          # of the old profile are retained.
          def rebuild_profile(old_rows, new_rows):
              segments = []
              for priority, rows in ((0, old_rows), (1, new_rows)):
                  for row in rows:
                      a, length, grade = float(row[0]), float(row[1]), float(row[2])
                      if length > 0:
                          segments.append((a, a + length, grade, priority))
              boundaries = sorted({x for a, b, _, _ in segments for x in (a, b)})
              result = []
              for a, b in zip(boundaries, boundaries[1:]):
                  if b <= a:
                      continue
                  mid = (a + b) / 2
                  active = [s for s in segments if s[0] <= mid < s[1]]
                  if not active:
                      continue
                  chosen = max(active, key=lambda s: s[3])
                  grade = chosen[2]
                  if result and abs((result[-1][0] + result[-1][1]) - a) < 0.01 and abs(result[-1][2] - grade) < 0.0001:
                      result[-1][1] += b - a
                  else:
                      result.append([a, b - a, grade])
              return [[int(a) if a.is_integer() else a, int(length) if length.is_integer() else length, grade]
                      for a, length, grade in result]

          for direction in ('odd', 'even'):
              data[direction]['el'] = rebuild_profile(data[direction]['el'], ext[direction])
              # The route-object file is the authoritative complete list.
              data[direction]['st'] = objects[direction]['st']
              data[direction]['sg'] = objects[direction]['sg']
              data[direction]['sg'].sort(key=lambda row: row[0])

          # Replace, never append, the GPS kilometre-post coordinates.
          data['posts'] = ext['posts']
          data['posts'].sort(key=lambda row: row[0])

          html = html[:start] + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + html[end:]
          html = html.replace('km>=4919&&km<=5330', 'km>=4680&&km<=5649')
          html = html.replace('Оцифрованный профиль уклонов в этой версии есть для 4919–5330 км', 'Оцифрованный профиль уклонов в этой версии есть для 4680–5649 км')
          html = html.replace('profile-app-v3', 'profile-app-v5').replace('profile-app-v4', 'profile-app-v5')
          sw = Path('site/sw.js')
          if sw.exists():
              sw.write_text(sw.read_text().replace('profile-app-v3', 'profile-app-v5').replace('profile-app-v4', 'profile-app-v5'), encoding='utf-8')
          path.write_text(html, encoding='utf-8')

          for direction in ('odd', 'even'):
              rows = data[direction]['el']
              gaps = sum(1 for a, b in zip(rows, rows[1:]) if b[0] > a[0] + a[1] + 0.01)
              overlaps = sum(1 for a, b in zip(rows, rows[1:]) if b[0] < a[0] + a[1] - 0.01)
              print(direction, 'profile rows:', len(rows), 'stations:', len(data[direction]['st']),
                    'signals:', len(data[direction]['sg']), 'gaps:', gaps, 'overlaps:', overlaps)
          print('GPS posts:', len(data['posts']))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
