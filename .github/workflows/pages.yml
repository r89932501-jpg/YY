name: Build and deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site unpack
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP archive found in repository root."
            exit 1
          fi
          for archive in "${zips[@]}"; do
            mkdir -p "unpack/${archive%.zip}"
            unzip -q "$archive" -d "unpack/${archive%.zip}"
          done
          # Some app exports wrap the website in artifact.tar.
          while IFS= read -r -d '' tarfile; do
            mkdir -p "$(dirname "$tarfile")/tar-extracted"
            tar -xf "$tarfile" -C "$(dirname "$tarfile")/tar-extracted"
          done < <(find unpack -type f -name '*.tar' -print0)
          # Locate the actual app entry point and publish its complete folder.
          index_file="$(find unpack -type f -name index.html -print -quit)"
          if [ -z "$index_file" ]; then
            echo "index.html was not found inside the uploaded ZIP."
            find unpack -maxdepth 4 -type f | head -100
            exit 1
          fi
          app_dir="$(dirname "$index_file")"
          cp -a "$app_dir"/. site/
          test -s site/index.html
          echo "Published source folder: $app_dir"
          find site -maxdepth 2 -type f | sort | head -100

      - name: Extend route profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          raw = Path('profile-extension.json.gz.b64').read_text().strip()
          try:
              payload = gzip.decompress(base64.b64decode(raw, validate=True))
          except Exception:
              payload = None
              for i in range(len(raw)):
                  candidate = raw[:i] + raw[i+1:]
                  if len(candidate) % 4:
                      continue
                  try:
                      payload = gzip.decompress(base64.b64decode(candidate, validate=True))
                      break
                  except Exception:
                      pass
              if payload is None:
                  raise RuntimeError('Profile extension data is damaged')
          ext = json.loads(payload)
          path = Path('site/index.html')
          html = path.read_text(encoding='utf-8')
          start = html.index('const D = ') + len('const D = ')
          end = html.index(';' + chr(10) + '(function', start)
          data = json.loads(html[start:end])
          for direction in ('odd', 'even'):
              data[direction]['el'].extend(ext[direction])
              data[direction]['el'].sort(key=lambda row: row[0])
              for i in range(1, len(data[direction]['el'])):
                  prev, cur = data[direction]['el'][i-1], data[direction]['el'][i]
                  gap = cur[0] - (prev[0] + prev[1])
                  if 0 < gap <= 5:
                      prev[1] += gap
          extra_raw = Path('station-signal-extension.json.gz.b64').read_text().strip()
          extra = json.loads(gzip.decompress(base64.b64decode(extra_raw)))
          for direction in ('odd', 'even'):
              # Combine all records with the same station name into one interval.
              combined = {}
              for row in list(data[direction]['st']) + list(extra[direction]['st']):
                  name = ' '.join(str(row[0]).strip().casefold().replace('ё', 'е').split())
                  if not name:
                      continue
                  start_m, end_m = float(row[1]), float(row[2])
                  if name not in combined:
                      combined[name] = [str(row[0]).strip(), start_m, end_m]
                  else:
                      combined[name][1] = min(combined[name][1], start_m)
                      combined[name][2] = max(combined[name][2], end_m)
              data[direction]['st'] = sorted(combined.values(), key=lambda row: row[1])
              data[direction]['sg'].extend(extra[direction]['sg'])
              data[direction]['sg'].sort(key=lambda row: row[0])
          data['posts'].extend(ext['posts'])
          data['posts'].sort(key=lambda row: row[0])
          html = html[:start] + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + html[end:]
          html = html.replace('km>=4919&&km<=5330', 'km>=4680&&km<=5649')
          html = html.replace('Оцифрованный профиль уклонов в этой версии есть для 4919–5330 км', 'Оцифрованный профиль уклонов в этой версии есть для 4680–5649 км')
          html = html.replace('Профиль оцифрован из профильной книги (PDF), километры в нём интерполированы по печатным отметкам, поэтому положение элементов может отличаться на 100–150 м. Уклоны даны для каждого направления по его ходу. Высоты относительные. Иркутский узел (км 5178–5199): взят ход, который непрерывно стыкуется с соседними листами. Привязка GPS идёт по километровым столбам. Справочный инструмент, он не заменяет профильную книгу и бортовые устройства.', 'Профиль расширен по режимным картам Улан-Удэ—Слюдянка и Зима—Нижнеудинск. Положение элементов привязано к печатным километровым отметкам и может иметь погрешность. GPS-привязка выполнена по координатам километровых столбов км 4680–5649; км 5630–5649 дополнены интерполяцией по треку GPX. Высоты относительные, рассчитаны по уклонам и длинам элементов. Справочный инструмент; не заменяет утверждённую профильную книгу и бортовые устройства.')
          path.write_text(html, encoding='utf-8')
          sw = Path('site/sw.js')
          if sw.exists():
              sw.write_text(sw.read_text().replace('profile-app-v3', 'profile-app-v4'), encoding='utf-8')
          print('Profile data extended:', len(data['odd']['el']), len(data['even']['el']), 'GPS posts:', len(data['posts']))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
